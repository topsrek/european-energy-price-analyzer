name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, typecheck, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Same major as the node:22-alpine build stage in worker/Dockerfile.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Market-time results must not depend on the viewer's zone. One zone far from
      # Europe is a cheap stand-in for the full `npm run test:tz` matrix.
      - name: npm test (TZ=America/New_York)
        run: npm test
        env:
          TZ: America/New_York
      - run: npm run build

  python:
    name: Python (pipeline and worker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Same as the python:3.13-slim runtime stage in worker/Dockerfile.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Pipeline tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Worker tests
        working-directory: worker
        run: python -m unittest test_server

  e2e:
    name: End-to-end (Playwright, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # playwright.config.ts launches /usr/bin/chromium (the system browser on the dev
      # machine). Point that path at the browser Playwright just installed.
      - name: Link Playwright's Chromium to /usr/bin/chromium
        run: sudo ln -sf "$(node -p "require('@playwright/test').chromium.executablePath()")" /usr/bin/chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
